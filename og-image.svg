<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="The Royal Date Bureau — book a date with the Princess">
  <title>The Royal Date Bureau</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6f3"/>
      <stop offset="55%" stop-color="#f3e9ff"/>
      <stop offset="100%" stop-color="#e6fbff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffeaf5" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffeaf5" stop-opacity="0"/>
    </radialGradient>
    <symbol id="crown" viewBox="0 0 48 36">
      <path d="M4 30 6 8l10 8 8-13 8 13 10-8 2 22Z" fill="currentColor" stroke="#1b1033" stroke-width="3" stroke-linejoin="round"/>
      <rect x="4" y="29" width="40" height="5" rx="2.5" fill="currentColor" stroke="#1b1033" stroke-width="3"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 32 30">
      <path d="M16 29S1 19.5 1 10.2A8.7 8.7 0 0 1 16 4.6 8.7 8.7 0 0 1 31 10.2C31 19.5 16 29 16 29Z"
            fill="currentColor" stroke="#1b1033" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 1.5 15 9l7.5.5-5.8 4.9 1.9 7.3L12 17.6 5.4 21.7l1.9-7.3L1.5 9.5 9 9Z"
            fill="currentColor" stroke="#1b1033" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- castle skyline -->
  <path transform="translate(0,110)" d="M0 630V500l70-34 46 34v-46l58-32 58 32v46l80-52 80 52V420l104-60 104 60v80l70-38 70 38v-80l104-60 104 60v80l70-34 70 34v-34l82-46 82 46V630Z"
        fill="#c9b8ff" opacity=".5"/>
  <g transform="translate(0,110)">
    <path d="M300 630V470l72-48 72 48v160Z" fill="#f6b3d8" stroke="#1b1033" stroke-width="6" stroke-linejoin="round"/>
    <path d="M300 470h144l-72-60Z" fill="#ff5fa2" stroke="#1b1033" stroke-width="6" stroke-linejoin="round"/>
    <rect x="352" y="530" width="40" height="64" rx="20" fill="#fff6ec" stroke="#1b1033" stroke-width="6"/>
    <path d="M760 630V496l64-44 64 44v134Z" fill="#bff0e2" stroke="#1b1033" stroke-width="6" stroke-linejoin="round"/>
    <path d="M760 496h128l-64-56Z" fill="#5fe3c0" stroke="#1b1033" stroke-width="6" stroke-linejoin="round"/>
    <rect x="804" y="552" width="40" height="60" rx="20" fill="#fff6ec" stroke="#1b1033" stroke-width="6"/>
  </g>

  <!-- floating trinkets -->
  <g opacity=".85">
    <use href="#heart" x="92"   y="96"  width="42" height="40" style="color:#ff5fa2"/>
    <use href="#star"  x="1064" y="120" width="40" height="40" style="color:#ffd23f"/>
    <use href="#heart" x="1092" y="330" width="34" height="32" style="color:#b78cff"/>
    <use href="#star"  x="150"  y="392" width="34" height="34" style="color:#5fe3c0"/>
    <use href="#heart" x="616"  y="70"  width="26" height="24" style="color:#ffd23f"/>
  </g>

  <!-- the princess -->
  <g transform="translate(78,196) scale(2.05)">
    <use href="#crown" x="26" y="0" width="48" height="36" style="color:#ffd23f"/>
    <rect x="28" y="34" width="44" height="50" rx="22" fill="#ffd9b8" stroke="#1b1033" stroke-width="4"/>
    <path d="M24 48c0-22 52-22 52 0 0 8-6-4-10-6-8 4-24 4-32 0-4 2-10 14-10 6Z" fill="#7a4de0" stroke="#1b1033" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="42" cy="56" r="4" fill="#1b1033"/><circle cx="58" cy="56" r="4" fill="#1b1033"/>
    <path d="M42 70q8 8 16 0" stroke="#1b1033" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="34" cy="66" r="4.5" fill="#ff5fa2" opacity=".5"/>
    <circle cx="66" cy="66" r="4.5" fill="#ff5fa2" opacity=".5"/>
  </g>

  <!-- a hopeful suitor -->
  <g transform="translate(944,188) scale(1.95)">
    <path d="M18 118c0-20 14-30 32-30s32 10 32 30Z" fill="#66d9ff" stroke="#1b1033" stroke-width="4" stroke-linejoin="round"/>
    <rect x="26" y="34" width="48" height="56" rx="24" fill="#f0b98a" stroke="#1b1033" stroke-width="4"/>
    <path d="M22 44C22 22 78 22 78 44c0 6-4 6-6 2-4-9-42-9-46 0-2 4-4 4-4-2Z" fill="#3a2a1d" stroke="#1b1033" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="40" cy="56" r="4.5" fill="#1b1033"/><circle cx="60" cy="56" r="4.5" fill="#1b1033"/>
    <circle cx="41.6" cy="54.4" r="1.5" fill="#fff"/><circle cx="61.6" cy="54.4" r="1.5" fill="#fff"/>
    <path d="M28 40l14-5" stroke="#1b1033" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M72 40l-14-5" stroke="#1b1033" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M38 74q12 -10 24 0" stroke="#1b1033" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="31" cy="68" r="5" fill="#ff5fa2" opacity=".45"/>
    <circle cx="69" cy="68" r="5" fill="#ff5fa2" opacity=".45"/>
  </g>

  <!-- kicker -->
  <g>
    <rect x="404" y="86" width="392" height="46" rx="23" fill="#1b1033"/>
    <text x="600" y="117" text-anchor="middle" font-family="Bungee, Impact, sans-serif"
          font-size="20" letter-spacing="2" fill="#ffd23f">POPULATION: 1 PRINCESS</text>
  </g>

  <!-- title -->
  <g font-family="Bungee, Impact, sans-serif" font-size="92" text-anchor="middle"
     fill="#ffd23f" stroke="#1b1033" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round">
    <text x="600" y="248">THE ROYAL</text>
    <text x="600" y="344">DATE BUREAU</text>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="'Baloo 2', Trebuchet MS, sans-serif"
        font-size="31" font-weight="700" fill="#1b1033">Book a date with the Princess.</text>
  <text x="600" y="438" text-anchor="middle" font-family="'Baloo 2', Trebuchet MS, sans-serif"
        font-size="31" font-weight="700" fill="#1b1033" opacity=".78">Several thousand men are already queuing.</text>

  <!-- live pill -->
  <g>
    <rect x="376" y="478" width="448" height="60" rx="30" fill="#1b1033"/>
    <circle cx="416" cy="508" r="10" fill="#ff2e2e" stroke="#fff" stroke-width="3"/>
    <text x="448" y="518" font-family="Bungee, Impact, sans-serif" font-size="23" fill="#fff">LIVE</text>
    <text x="526" y="518" font-family="Bungee, Impact, sans-serif" font-size="23" fill="#ffd23f">5,127 SUITORS WAITING</text>
  </g>
</svg>
